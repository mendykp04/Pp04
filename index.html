<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>หายไว ๆ นะ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Mali:wght@400;600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: #000; overflow: hidden; }
  body {
    font-family: "Mali", "Sukhumvit Set", "Thonburi", "Noto Sans Thai", "Leelawadee UI", sans-serif;
    color: #fff;
    -webkit-font-smoothing: antialiased;
  }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }

  /* ปุ่มหัวใจตอนเริ่ม */
  #start {
    position: fixed; left: 50%; top: 50%;
    transform: translate(-28px, -50%);
    display: flex; align-items: flex-end;
    background: none; border: 0; color: inherit; font: inherit;
    cursor: pointer; transition: opacity .35s;
    -webkit-tap-highlight-color: transparent;
  }
  #start svg { width: 56px; height: 56px; flex: none; animation: beat 1.1s ease-in-out infinite; }
  #start .label {
    text-align: left; font-size: 15px; line-height: 1.5;
    padding: 0 28px 6px 10px; margin: 0 0 4px -8px;
    border-bottom: 1.5px solid #fff; white-space: nowrap;
  }
  #start:focus-visible { outline: 2px solid #ff8fa3; outline-offset: 12px; border-radius: 8px; }
  #start.gone { opacity: 0; pointer-events: none; }
  @keyframes beat { 0%, 100% { transform: scale(1); } 35% { transform: scale(1.18); } 60% { transform: scale(.96); } }

  /* ข้อความให้กำลังใจ */
  #note {
    position: fixed; left: 7vw; top: 50%; transform: translateY(-50%);
    width: min(44vw, 540px);
    font-size: clamp(16px, 1.55vw, 22px); line-height: 1.9;
    text-shadow: 0 0 10px #000, 0 0 4px #000;
    pointer-events: none;
  }
  #note h1 {
    font-size: 1.5em; font-weight: 600; color: #ff8fa3; margin-bottom: .5em;
    opacity: 0; transform: translateY(8px); transition: opacity .8s, transform .8s;
  }
  #note h1.show { opacity: 1; transform: none; }
  #note p { min-height: .95em; }
  #note p.gap { min-height: 0; height: .8em; }
  #note p.sign { color: #ffb3c1; margin-top: .6em; }
  .caret {
    display: inline-block; width: 2px; height: 1.1em; margin-left: 2px;
    background: #ff8fa3; vertical-align: -0.2em; animation: blink .8s steps(1) infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }

  @media (max-aspect-ratio: 9/10), (max-width: 720px) {
    #note {
      left: 7vw; right: 7vw; width: auto; top: max(4vh, env(safe-area-inset-top));
      transform: none; font-size: 15px; line-height: 1.65;
    }
    #note h1 { font-size: 1.35em; margin-bottom: .3em; }
    #note p.gap { height: .5em; }
  }
  @media (prefers-reduced-motion: reduce) {
    #start svg, .caret { animation: none; }
  }
</style>
</head>
<body>

<canvas id="scene" aria-hidden="true"></canvas>

<button id="start" type="button">
  <svg viewBox="-0.6 -0.6 1.2 1.2" aria-hidden="true">
    <path fill="#ff8fa3" d="M0 .5C-.15 .3-.55 .1-.55-.2C-.55-.48-.2-.55 0-.28C.2-.55 .55-.48 .55-.2C.55 .1 .15 .3 0 .5Z"/>
  </svg>
  <span class="label"><span id="startLine1"></span><br><span id="startLine2"></span></span>
</button>

<div id="note" aria-live="polite"><h1 id="noteTitle"></h1></div>

<!-- อยากมีเพลง: วางไฟล์ชื่อ song.mp3 ไว้ในโฟลเดอร์เดียวกับไฟล์นี้ -->
<audio id="song" src="song.mp3" loop preload="none"></audio>

<script>
// ===== แก้ข้อความได้ตรงนี้ =====
const CONFIG = {
  startLine1: 'กดตรงนี้สิ :)',
  startLine2: 'คนเก่ง',
  title: 'ถึงคนเก่งนะคับ',
  lines: [                      // บรรทัดว่าง '' = เว้นช่วง
    'เค้ารู้ว่าตอนนี้เธอไม่สบาย',
    'แล้วก็รู้ด้วยว่าเธอพยายามเข้มแข็งอยู่มากแค่ไหน',
    '',
    'ไม่ต้องรีบหายก็ได้นะ ค่อย ๆ พักไป',
    'กินข้าว กินยา ดื่มน้ำเยอะ ๆ แล้วนอนให้เต็มอิ่ม',
    'สองนิ้วนะคับ ขอให้หายเร็วๆนะงับบบบ',
    '',
    'วันไหนเหนื่อย อดทนหน่อยนะคับเดี๋ยวก็หายเนอะ',
    'เค้าอยู่ตรงนี้ ไม่ไปไหน',
    '',
    'หายไว ๆ นะคนเก่ง',
    'ยิ้มเยอะๆนะคับ ถึงจะป่วยก็ตาม เพราะตอนเธอยิ้มโลกก็สดใสขึ้นเยอะเลยคับ',
  ],
  sign: '— จาก พีพี',
  typeSpeed: 55,                // มิลลิวินาทีต่อตัวอักษร
};
// ================================

const canvas = document.getElementById('scene');
const ctx = canvas.getContext('2d');
const startBtn = document.getElementById('start');
const note = document.getElementById('note');
const noteTitle = document.getElementById('noteTitle');
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;

document.getElementById('startLine1').textContent = CONFIG.startLine1;
document.getElementById('startLine2').textContent = CONFIG.startLine2;

// ช่วงเวลาของแต่ละฉาก (ms นับจากตอนกด)
const T = { ground: 700, grow: 1100, bloom: 3000, bloomSpan: 4200, fall: 7000, move: 7600, moveSpan: 1400, text: 9000 };

const TRUNK = '#c9838f';
const PETALS = ['#ff4d6d', '#ff758f', '#ff8fa3', '#ffb3c1', '#ffccd5', '#c9184a', '#ff6b9d', '#f72585'];
const CROWN = { y: -330, r: 150 };

// กิ่ง: [x0,y0, cx,cy, x1,y1, รัศมีโคน, รัศมีปลาย, เริ่ม(ms), นาน(ms)] หน่วยเป็นพิกัดของต้นไม้ (โคนต้น = 0,0)
const BRANCHES = [
  [0, 0, 25, -140, -5, -300, 16, 6, 0, 1400],
  [8, -130, 70, -190, 130, -260, 7, 2, 700, 1000],
  [5, -170, -60, -210, -130, -290, 7, 2, 700, 1000],
  [0, -230, 50, -290, 70, -370, 5, 1.5, 1000, 1000],
  [-3, -250, -40, -310, -60, -390, 5, 1.5, 1000, 1000],
  [100, -232, 135, -260, 150, -330, 3, 1, 1500, 800],
  [-100, -262, -135, -285, -150, -345, 3, 1, 1500, 800],
];

const HEART = new Path2D('M0 .5C-.15 .3-.55 .1-.55-.2C-.55-.48-.2-.55 0-.28C.2-.55 .55-.48 .55-.2C.55 .1 .15 .3 0 .5Z');

// สุ่มแบบมี seed เพื่อให้ต้นไม้หน้าตาเหมือนเดิมทุกครั้งที่ย่อ/ขยายจอ
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

function makeBlooms(count) {
  const rnd = mulberry32(20261013);
  const list = [];
  while (list.length < count) {
    const x = rnd() * 2.4 - 1.2, y = rnd() * 2.4 - 1.1;
    // สมการหัวใจ: (x² + y² − 1)³ − x²y³ ≤ 0
    if (Math.pow(x * x + y * y - 1, 3) - x * x * y * y * y > 0) continue;
    list.push({
      x: x * CROWN.r,
      y: CROWN.y - y * CROWN.r,
      size: 9 + rnd() * 13,
      rot: (rnd() - 0.5) * 1.4,
      color: PETALS[Math.floor(rnd() * PETALS.length)],
      alpha: 0.55 + rnd() * 0.4,
      order: Math.hypot(x, y - 0.2) + rnd() * 0.45,
    });
  }
  return list.sort((a, b) => a.order - b.order);
}

let W, H, dpr, portrait, groundY, unit, blooms;
function resize() {
  W = innerWidth; H = innerHeight;
  dpr = Math.min(devicePixelRatio || 1, 2);
  canvas.width = Math.round(W * dpr);
  canvas.height = Math.round(H * dpr);
  portrait = W < H * 0.9 || W <= 720;
  groundY = H * (portrait ? 0.93 : 0.88);
  unit = portrait ? Math.min(H * 0.43 / 540, W * 0.9 / 380) : Math.min(H * 0.78 / 540, W * 0.42 / 380);
  const count = W < 720 ? 600 : 900;
  if (!blooms || blooms.length !== count) blooms = makeBlooms(count);
}
addEventListener('resize', resize);
resize();

const clamp01 = v => v < 0 ? 0 : v > 1 ? 1 : v;
const easeInOut = p => p < 0.5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2;
const easeOut = p => 1 - Math.pow(1 - p, 3);
const easeOutBack = p => 1 + 2.7 * Math.pow(p - 1, 3) + 1.7 * Math.pow(p - 1, 2);

function drawHeart(x, y, size, rot, color, alpha) {
  const k = dpr * size, c = Math.cos(rot) * k, s = Math.sin(rot) * k;
  ctx.setTransform(c, s, -s, c, x, y);
  ctx.globalAlpha = alpha;
  ctx.fillStyle = color;
  ctx.fill(HEART);
}

let t0 = 0, last = 0, typingStarted = false, spawnAt = 0;
const falling = [];

function frame(now) {
  const t = now - t0, dt = Math.min(now - last, 50) / 1000;
  last = now;

  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalAlpha = 1;
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  const shift = portrait ? 0 : easeInOut(clamp01((t - T.move) / T.moveSpan));
  const treeX = W / 2 + (W * 0.72 - W / 2) * shift;
  const ox = treeX * dpr, oy = groundY * dpr, k = unit * dpr;

  // เส้นพื้น
  const g = easeOut(clamp01((t - T.ground) / 800));
  if (g > 0) {
    const half = Math.min(W * 0.32, 250 * unit) * g;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.strokeStyle = 'rgba(255,255,255,.9)';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(treeX - half, groundY + 1);
    ctx.lineTo(treeX + half, groundY + 1);
    ctx.stroke();
  }

  // หัวใจหล่นลงดินกลายเป็นเมล็ด
  if (t < T.grow + 500) {
    const f = clamp01(t / 800);
    drawHeart(ox, (H / 2 + (groundY - 6 - H / 2) * f * f) * dpr, 46 - 34 * f, 0, '#ff8fa3', 1);
  }

  // ลำต้นและกิ่ง
  ctx.setTransform(k, 0, 0, k, ox, oy);
  ctx.globalAlpha = 1;
  ctx.fillStyle = TRUNK;
  ctx.beginPath();
  for (const [x0, y0, cx, cy, x1, y1, r0, r1, delay, span] of BRANCHES) {
    const p = easeOut(clamp01((t - T.grow - delay) / span));
    if (p <= 0) continue;
    const steps = Math.ceil((Math.hypot(cx - x0, cy - y0) + Math.hypot(x1 - cx, y1 - cy)) / 1.5);
    for (let i = 0; i <= steps * p; i++) {
      const q = i / steps, m = 1 - q;
      const x = m * m * x0 + 2 * m * q * cx + q * q * x1;
      const y = m * m * y0 + 2 * m * q * cy + q * q * y1;
      const r = r0 + (r1 - r0) * q;
      ctx.moveTo(x + r, y);
      ctx.arc(x, y, r, 0, 6.2832);
    }
  }
  ctx.fill();

  // ดอกหัวใจค่อย ๆ บานจากกลางพุ่มออกไป
  const per = T.bloomSpan / blooms.length;
  for (let i = 0; i < blooms.length; i++) {
    const a = (t - T.bloom - i * per) / 400;
    if (a <= 0) break;
    const b = blooms[i];
    drawHeart(ox + b.x * k, oy + b.y * k, b.size * unit * (a >= 1 ? 1 : easeOutBack(a)), b.rot, b.color, b.alpha);
  }

  // หัวใจร่วง
  if (!REDUCED && t > T.fall && now > spawnAt && falling.length < 40) {
    spawnAt = now + 180 + Math.random() * 220;
    const b = blooms[Math.floor(Math.random() * blooms.length)];
    falling.push({
      x: b.x, y: b.y, size: 8 + Math.random() * 8, color: b.color,
      vy: 22 + Math.random() * 30, sway: 8 + Math.random() * 16,
      phase: Math.random() * 6.28, spin: (Math.random() - 0.5) * 1.6, rot: b.rot,
    });
  }
  for (let i = falling.length - 1; i >= 0; i--) {
    const h = falling[i];
    h.y += h.vy * dt; h.phase += dt * 1.6; h.rot += h.spin * dt;
    if (h.y >= -2) { falling.splice(i, 1); continue; }
    const x = h.x + Math.sin(h.phase) * h.sway;
    drawHeart(ox + x * k, oy + h.y * k, h.size * unit, h.rot, h.color, 0.9 * clamp01(-h.y / 60));
  }

  if (!typingStarted && t >= (portrait ? T.move : T.text)) { typingStarted = true; typeNote(); }
  requestAnimationFrame(frame);
}

// ตัดเป็นกลุ่มตัวอักษร สระ/วรรณยุกต์ไทยจะได้ไม่หลุดจากพยัญชนะตอนพิมพ์ทีละตัว
function graphemes(s) {
  if (window.Intl && Intl.Segmenter) {
    return Array.from(new Intl.Segmenter('th', { granularity: 'grapheme' }).segment(s), x => x.segment);
  }
  return s.match(/.[ัิ-ฺ็-๎️‍]*/gu) || [];
}

function typeNote() {
  noteTitle.textContent = CONFIG.title;
  noteTitle.classList.add('show');
  const rows = CONFIG.lines.map(text => ({ text, cls: text ? '' : 'gap' }));
  if (CONFIG.sign) rows.push({ text: CONFIG.sign, cls: 'sign' });

  if (REDUCED) {
    for (const row of rows) {
      const p = document.createElement('p');
      p.className = row.cls; p.textContent = row.text; note.appendChild(p);
    }
    return;
  }

  const caret = document.createElement('span');
  caret.className = 'caret';
  let r = 0;
  (function nextRow() {
    if (r >= rows.length) return;
    const row = rows[r++];
    const p = document.createElement('p');
    p.className = row.cls;
    note.appendChild(p);
    if (!row.text) return setTimeout(nextRow, 250);
    const text = document.createTextNode('');
    p.append(text, caret);
    const parts = graphemes(row.text);
    let i = 0;
    (function tick() {
      if (i < parts.length) { text.data += parts[i++]; setTimeout(tick, CONFIG.typeSpeed); }
      else setTimeout(nextRow, 380);
    })();
  })();
}

startBtn.addEventListener('click', () => {
  startBtn.classList.add('gone');
  document.getElementById('song').play().catch(() => {});
  t0 = last = performance.now() - (REDUCED ? 20000 : 0);
  requestAnimationFrame(frame);
}, { once: true });
</script>
</body>
</html>
